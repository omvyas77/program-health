name: gph
version: "1.0"
profile: gph
config-version: 2

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages", "logs"]

models:
  gph:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table
