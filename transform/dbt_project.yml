name: gph
version: "1.0"
profile: gph
config-version: 2

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages", "logs"]

models:
  gph:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table

vars:
  # The course watch list, chosen by Om on Oct 24, 2026: Gies undergraduate courses averaging at
  # least watch_min_graded graded students per long term offered, with watch_min_rate or more at
  # C or below or withdrawing in at least watch_min_terms of the last four long terms.
  watch_min_graded: 150
  watch_min_rate: 0.15
  watch_min_terms: 2
