name: snapshot

on:
  schedule:
    # 13:07 UTC: GitHub's scheduler is most delayed at the top of the hour. The 19:37 run is
    # a backup for days GitHub drops the first; the script exits if today's file exists.
    - cron: "7 13 * * *"
    - cron: "37 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Shared with refresh.yml: both commit data/marts, so they never run at the same time.
  group: data
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The branch's latest commit, not the one current when the run was queued: a run that waited
      # behind another in the data group must start from that run's commit.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-snapshot.txt

      - run: pip install -r requirements-snapshot.txt

      - name: Take the snapshot
        id: snapshot
        run: |
          python -m ingest.cis_snapshot
          if [ -n "$(git status --porcelain data/snapshots/cis)" ]; then
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild the registration watch and its report
        if: steps.snapshot.outputs.new == 'true'
        run: |
          mkdir -p warehouse
          # cautious: skip tests that also read marts this job doesn't build
          dbt build --project-dir transform --profiles-dir transform --select +mart_registration_watch \
            --indirect-selection cautious
          python -m publish.export mart_registration_watch
          python -m publish.registration_report

      - name: Commit the new snapshot
        run: |
          git add data/snapshots/cis data/marts/mart_registration_watch.parquet \
            data/marts/mart_registration_watch.csv reports/registration_watch_2027-sp.md
          if git diff --cached --quiet; then
            echo "no new snapshot"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "snapshot 2027-sp $(date -u +%F)"
          # main may have moved while the job ran. Only this job and refresh.yml write these
          # files, and the shared concurrency group keeps them apart, so the rebase is clean.
          git pull --rebase
          git push
