name: refresh

on:
  schedule:
    # Mondays at 11:17 UTC, off the hour when GitHub's scheduler is busiest.
    - cron: "17 11 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  # Shared with snapshot.yml: both commit data/marts, so they never run at the same time.
  group: data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # The branch's latest commit, not the one current when the run was queued: a run that waited
      # behind another in the data group must start from that run's commit.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Note when the run started
        run: echo "STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - name: Check sources and ingest what changed
        id: ingest
        run: python -m ingest.refresh --out "$RUNNER_TEMP/refresh.json"

      - name: Open an issue for files the refresh won't ingest on its own
        if: steps.ingest.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          new=$(jq -r '[.new_ipeds_files[], .new_catalog_terms[]] | join(", ")' "$RUNNER_TEMP/refresh.json")
          if [ -z "$new" ]; then
            exit 0
          fi
          title="New upstream files: $new"
          if [ -n "$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[].number')" ]; then
            echo "an open issue already covers $new"
            exit 0
          fi
          gh issue create --title "$title" --body "The weekly refresh found files it doesn't ingest by itself. A new IPEDS file goes in config/ipeds_files.csv only after its dictionary has been read and docs/ipeds_variables.md updated. A new catalog term needs adding to TERMS in ingest/catalog.py. Found by $RUN_URL"

      - name: Build, forecast, export, and test
        id: checks
        if: steps.ingest.outcome == 'success'
        continue-on-error: true
        run: |
          make build PYTHON=python DBT=dbt
          make forecast PYTHON=python
          make export PYTHON=python
          python -m pytest -q

      - name: Publish to the Google Sheet
        id: publish
        if: steps.checks.outcome == 'success'
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: python -m publish.sheets

      - name: Log the run
        if: always()
        run: >
          python -m publish.refresh_log
          --changes "$RUNNER_TEMP/refresh.json"
          --trigger "${{ github.event_name }}"
          --published "${{ steps.publish.outcome == 'success' }}"
          --started "$STARTED"

      - name: Publish the log
        if: steps.publish.outcome == 'success'
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: python -m publish.sheets mart_refresh_log

      - name: Commit
        if: always()
        run: |
          # A failed run commits only its log row, so nothing unchecked reaches main.
          if [ "${{ steps.publish.outcome }}" = "success" ]; then
            git add data/extracts data/marts reports
            message="refresh $(date -u +%F)"
          else
            git add data/marts/mart_refresh_log.parquet data/marts/mart_refresh_log.csv
            message="refresh $(date -u +%F), checks failed"
          fi
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "$message"
          git pull --rebase --autostash
          git push

      - name: Fail the run if a check failed
        if: always() && (steps.ingest.outcome != 'success' || steps.checks.outcome != 'success' || steps.publish.outcome != 'success')
        run: |
          echo "ingest ${{ steps.ingest.outcome }}, checks ${{ steps.checks.outcome }}, publish ${{ steps.publish.outcome }}"
          exit 1
