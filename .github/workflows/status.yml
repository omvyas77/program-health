name: status

on:
  schedule:
    # GitHub starts this repo's scheduled jobs two to six hours late, and on Oct 27, 2026 none of
    # the morning runs started before 8:44 Central. So the chain starts the evening before (0:20
    # and 2:20 UTC are 6:20 to 9:20 pm Central): a run too far from 8:14 sleeps, making no
    # request, then starts a fresh run, which begins within seconds, until one can wait for 8:14
    # inside the job limit (ingest/cis_status.py). The morning runs stay as backups.
    - cron: "20 0 * * *"
    - cron: "20 2 * * *"
    - cron: "20 9 * * *"
    - cron: "20 11 * * *"
    - cron: "20 13 * * *"
  workflow_dispatch:
    inputs:
      check_relay:
        description: Only start the next run, to check the hand-off. Reads nothing.
        type: boolean
        default: false

permissions:
  contents: write
  # to start the next run in the chain
  actions: write

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    # One run at a time: a sleeping or waiting run holds this group. GitHub keeps one run pending
    # behind it and cancels any older pending one, and whichever starts follows the same plan, so
    # the chain survives. It doesn't hold the data group, so it never blocks the snapshot or refresh.
    concurrency:
      group: status
      cancel-in-progress: false
    outputs:
      new: ${{ steps.status.outputs.new }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-snapshot.txt

      - run: pip install -r requirements-snapshot.txt

      - name: Wait for 8:14 Central and read enrollment status, or relay
        id: status
        if: ${{ !inputs.check_relay }}
        run: |
          python -m ingest.cis_status
          if [ -n "$(git status --porcelain data/snapshots/cis_status)" ]; then
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Start the next run in the chain
        if: steps.status.outputs.relay == 'true' || inputs.check_relay
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run status.yml --ref "${{ github.ref_name }}"

      - name: Commit the statuses
        if: steps.status.outputs.new == 'true'
        run: |
          git add data/snapshots/cis_status
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "status 2027-sp $(TZ=America/Chicago date +%F)"
          git pull --rebase --autostash
          git push

  rebuild:
    needs: status
    if: needs.status.outputs.new == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Shared with snapshot.yml and refresh.yml: all three commit data/marts.
    concurrency:
      group: data
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-snapshot.txt

      - run: pip install -r requirements-snapshot.txt

      - name: Rebuild the registration watch and its report
        run: |
          mkdir -p warehouse
          # cautious: skip tests that also read marts this job doesn't build
          dbt build --project-dir transform --profiles-dir transform --select +mart_registration_watch \
            --indirect-selection cautious
          python -m publish.export mart_registration_watch
          python -m publish.registration_report

      - name: Commit the rebuilt watch
        run: |
          git add data/marts/mart_registration_watch.parquet data/marts/mart_registration_watch.csv \
            reports/registration_watch_2027-sp.md
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "registration watch $(TZ=America/Chicago date +%F)"
          git pull --rebase --autostash
          git push

      # As in snapshot.yml: after the commit, so the Sheet carries the day's closed share.
      - name: Publish the watch to the Google Sheet
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: python -m publish.sheets mart_registration_watch
