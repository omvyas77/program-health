name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - run: ruff check .

      - run: ruff format --check .

      # Against the committed extracts: data/raw isn't in the repo and isn't needed.
      - run: make build PYTHON=python DBT=dbt

      - run: python -m pytest -q
